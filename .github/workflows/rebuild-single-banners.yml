name: Rebuild single banners

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Create normal single banner files and update site
        shell: bash
        run: |
          python <<'PY'
          from PIL import Image
          from pathlib import Path
          import re

          root = Path('.')
          assets = root / 'assets'

          def stitch(names, output):
              ims = [Image.open(assets/n).convert('RGB') for n in names]
              h = max(i.height for i in ims)
              fixed=[]
              for im in ims:
                  if im.height != h:
                      nw=round(im.width*h/im.height)
                      im=im.resize((nw,h), Image.Resampling.LANCZOS)
                  fixed.append(im)
              out=Image.new('RGB',(sum(i.width for i in fixed),h))
              x=0
              for im in fixed:
                  out.paste(im,(x,0)); x+=im.width
              out.save(assets/output,'JPEG',quality=94,optimize=True,progressive=True)

          vox_parts=[f'banner_vox_{i}.webp' for i in range(1,6)]
          jst_parts=[f'banner_jst_{i}.webp' for i in range(1,4)]
          stitch(vox_parts,'banner_vox_ecclesiae.jpg')
          stitch(jst_parts,'banner_jst_claro.jpg')

          # Elimina definitivamente os banners fatiados e o arquivo inválido anterior.
          for n in vox_parts+jst_parts+['banner_vox_ecclesiae.webp']:
              p=assets/n
              if p.exists(): p.unlink()

          # Mesmo método do Acervo JST: header com uma única tag IMG responsiva.
          for p in root.rglob('*.html'):
              txt=p.read_text(encoding='utf-8')
              prefix='../' if p.parent.name=='jornais' else ''
              new_header=(f'<header class="site-banner hero-image">'
                          f'<div class="banner-wrap"><img class="hero-banner" '
                          f'src="{prefix}assets/banner_vox_ecclesiae.jpg" '
                          f'alt="Vox Ecclesiae — Hemeroteca Digital da Imprensa Católica de Goiás"></div>'
                          f'</header>')
              txt=re.sub(r'<header class="site-banner">.*?</header>',new_header,txt,flags=re.S)
              if p.name=='santuario-da-trindade.html':
                  txt=re.sub(r'<div class="jst-banner-slices"[^>]*>.*?</div>',
                             '<div class="jst-banner-wrap"><img class="jst-hero-banner" src="../assets/banner_jst_claro.jpg" alt="Santuário da Trindade — Órgam do Santuário da Trindade — Acervo Digital do Jornal Santuário da Trindade (1922–1931)"></div>',
                             txt,flags=re.S)
              p.write_text(txt,encoding='utf-8')

          # CSS simples, igual à lógica usada no Acervo JST.
          css="""@import url('style-core.css');
          .site-banner.hero-image{display:block!important;padding:0!important;background:#efe1bd!important;color:inherit!important;min-height:0!important;line-height:0!important}
          .banner-wrap{position:relative;line-height:0;overflow:hidden;background:#ead9b5}
          .hero-banner{display:block;width:100%;height:auto;max-height:none;object-fit:contain;background:#efe1bd}
          .jst-banner-wrap{position:relative;line-height:0;overflow:hidden;background:#ead9b5;border:1px solid #b58b50}
          .jst-hero-banner{display:block;width:100%;height:auto;max-height:none;object-fit:contain;background:#efe1bd}
          @media(max-width:760px){.site-banner.hero-image{padding:0!important}.hero-banner,.jst-hero-banner{width:100%;height:auto}}
          """
          (assets/'style.css').write_text(css,encoding='utf-8')

          core=assets/'app-core.js'
          if core.exists():
              (assets/'app.js').write_text(core.read_text(encoding='utf-8'),encoding='utf-8')
          PY
      - name: Commit corrected single banners
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Use single normal banner images like Acervo JST"
            git push
          fi
